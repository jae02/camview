services:
  app:
    build: .
    container_name: dslreview-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin1234}

    volumes:
      - ./data/articles:/app/data/articles

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dslreview.rule=Host(`dslreview.co.kr`) || Host(`www.dslreview.co.kr`)"
      - "traefik.http.routers.dslreview.entrypoints=websecure"
      - "traefik.http.routers.dslreview.tls.certresolver=myresolver"
      - "traefik.http.services.dslreview.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"

    networks:
      - traefik-public

networks:
  traefik-public:
    external: true

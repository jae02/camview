
services:
  app:
    build: .
    container_name: camera-specs-app 
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-dlsrivew2026}
    
    volumes:
      - ./data/articles:/app/data/articles
      - ./uploads:/app/public/uploads

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 500M
        reservations:
          memory: 200M

    labels:
      - "traefik.enable=true"
      # dslreview.co.kr 및 www.dslreview.co.kr 모두 연결
      - "traefik.http.routers.camera-specs.rule=Host(`dslreview.co.kr`) || Host(`www.dslreview.co.kr`)"
      - "traefik.http.routers.camera-specs.entrypoints=websecure"
      - "traefik.http.routers.camera-specs.tls.certresolver=myresolver"
      - "traefik.http.services.camera-specs.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"

    networks:
      - traefik-public

networks:
  traefik-public:
    external: true

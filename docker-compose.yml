services:
  app:
    build: .
    container_name: camera-specs-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://www.dslreview.co.kr

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M

    labels:
      - "traefik.enable=true"
      # dslreview.co.kr 및 www.dslreview.co.kr 연결
      - "traefik.http.routers.camera-specs.rule=Host(`dslreview.co.kr`) || Host(`www.dslreview.co.kr`)"
      - "traefik.http.routers.camera-specs.entrypoints=websecure"
      - "traefik.http.routers.camera-specs.tls.certresolver=myresolver"
      - "traefik.http.services.camera-specs.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"

    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
